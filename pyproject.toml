[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amg-player"
dynamic = ["version"]
description = "Browse & play embedded tracks from Angry Metal Guy music reviews"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "desbma" }]
keywords = ["music", "metal", "extreme", "angry", "guy", "player", "youtube", "bandcamp", "soundcloud"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Utilities",
]
dependencies = [
    "colorlog>=6.12.0",
    "cssselect>=1.5.0",
    "curses-menu==0.9.0",
    "lxml>=6.1.3",
    "more-itertools>=11.1.0",
    "mutagen>=1.48.1",
    "pathvalidate>=3.3.1",
    "pillow>=12.3.0",
    "platformdirs>=4.11.7",
    "python-magic>=0.4.27",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "unidecode>=1.4.0",
    "web-cache>=1.1.0",
    "yt-dlp[default,curl-cffi]>=2026.8.19",
]

[project.scripts]
amg = "amg:cl_main"

[project.urls]
Homepage = "https://github.com/desbma/amg-player"
Repository = "https://github.com/desbma/amg-player"

[tool.hatch.build.targets.wheel]
packages = ["amg"]

[tool.hatch.version]
source = "regex"
path = "amg/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # dynamically typed expression
    "BLE001",  # blind except
    "C901",    # complex structure
    "COM812",  # missing trailing comma
    "CPY",     # copyright notice
    "D203",    # incompatible with D211
    "D212",    # incompatible with D213
    "DTZ",     # naive datetime
    "EM",      # exception message string literal
    "FIX",     # line contains TODO
    "G004",    # logging f-string
    "N801",    # invalid class name
    "N802",    # invalid function name
    "N812",    # lowercase imported as non lowercase
    "PLR09",   # too many branches/statements/arguments
    "PT",      # pytest
    "RUF001",  # ambiguous unicode character
    "S101",    # assert
    "S301",    # pickle
    "S311",    # non cryptographic random
    "S603",    # subprocess call
    "T201",    # print, used for command line output
    "TC",      # typing only import
    "TD",      # TODO format
    "TRY003",  # long exception message
    "TRY400",  # error logging instead of exception logging
]

[dependency-groups]
dev = ["pre-commit", "ruff", "ty"]
